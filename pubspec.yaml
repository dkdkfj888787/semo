name: index
description: "Index - Modern VOD Streaming App by Voxin"
version: 2.1.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  
  # Core dependencies
  http: ^1.2.2
  shared_preferences: ^2.3.2
  package_info_plus: ^8.1.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  
  # UI dependencies
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  flutter_settings_ui: ^3.0.1
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  infinite_scroll_pagination: ^4.0.0
  swipeable_page_route: ^0.4.4
  
  # Video & Media
  video_player: ^2.9.2
  audio_video_progress_bar: ^2.0.3
  subtitle_wrapper_package: ^2.2.1
  wakelock_plus: ^1.2.8
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3
  
  # Utilities
  archive: ^3.6.1
  internet_connection_checker_plus: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - fonts/
